<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Restaurant Menu</title><link rel="stylesheet" href="restaurant.css?v=2"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script defer src="config.js?v=1"></script><script defer src="restaurant-menu.js?v=2"></script></head><body><div id="publicMenu" class="classic"><header class="menuHero"><div class="heroInner"><img id="restaurantLogo" alt="Restaurant logo" hidden><div><p class="heroEyebrow">DIGITAL MENU</p><h1 id="restaurantName">Loading restaurant...</h1><p id="tagline"></p><small id="address"></small></div></div></header><main class="menuMain"><label id="searchWrap" class="searchWrap"><span>Search dishes</span><input id="search" class="search" placeholder="Search dishes or categories" type="search"></label><nav id="chips" class="chipbar" aria-label="Food categories"></nav><div id="foods" class="foodGrid"></div><p id="notice" role="status"></p></main><div id="cartbar" class="cartbar" hidden><strong id="cartSummary"></strong><button id="viewCart">View cart →</button></div><div id="popup" class="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="popupTitle"><button id="closePopup" class="modalClose" aria-label="Close">✕</button><img id="popupImage" alt="Dish photo" hidden><h2 id="popupTitle"></h2><p id="popupDescription"></p><strong id="popupPrice"></strong><div class="actions"><div class="qty"><button id="minus" aria-label="Decrease quantity">−</button><strong id="quantity">1</strong><button id="plus" aria-label="Increase quantity">+</button></div><strong id="popupTotal"></strong></div><button id="addCart" class="wide">Add to cart</button></section></div><div id="checkout" class="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle"><button id="closeCheckout" class="modalClose" aria-label="Close">✕</button><h2 id="checkoutTitle">Your order</h2><div id="cartItems"></div><h3 id="grandTotal"></h3><label class="field">Your name<input id="customerName" autocomplete="name" maxlength="100"></label><label class="field">Phone number<input id="customerPhone" inputmode="tel" maxlength="20"></label><label class="field" id="tableField">Table number<input id="tableNumber" maxlength="20"></label><p id="checkoutError" role="status"></p><button id="sendOrder" class="wide">Continue to WhatsApp</button><p class="muted">Review the message and tap Send in WhatsApp to place your order.</p></section></div></div></body></html>
