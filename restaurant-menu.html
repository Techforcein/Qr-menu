<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant Menu | PageForge</title><link rel="stylesheet" href="restaurant.css?v=1"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script defer src="config.js?v=1"></script><script defer src="restaurant-menu.js?v=1"></script></head><body><main id="publicMenu"><header class="menuHero"><div class="heroInner"><img id="restaurantLogo" alt="Restaurant logo" hidden><h1 id="restaurantName">Loading restaurant...</h1><p id="tagline"></p><small id="address"></small></div></header><div class="menuMain"><input class="search" id="search" placeholder="Search dishes or categories..." aria-label="Search menu"><div id="chips" class="chipbar"></div><p id="notice" role="status"></p><div id="foods" class="foodGrid"></div></div><div id="cartbar" class="cartbar" hidden><strong id="cartSummary"></strong><button id="viewCart">View cart / Order</button></div></main><div id="popup" class="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="popupTitle"><button id="closePopup" class="secondary" aria-label="Close popup">✕</button><img id="popupImage" hidden alt=""><h2 id="popupTitle"></h2><p id="popupDescription"></p><p id="popupPrice"></p><div class="qty"><button id="minus">−</button><strong id="quantity">1</strong><button id="plus">+</button></div><h3 id="popupTotal"></h3><button id="addCart">Add to cart</button></section></div><div id="checkout" class="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle"><button id="closeCheckout" class="secondary">✕</button><h2 id="checkoutTitle">Your order</h2><div id="cartItems"></div><h3 id="grandTotal"></h3><label class="field">Your name<input id="customerName" maxlength="80" autocomplete="name" required></label><label class="field">Phone number<input id="customerPhone" inputmode="tel" maxlength="16" placeholder="10-digit mobile number" required></label><label class="field">Table number<input id="tableNumber" maxlength="20" placeholder="e.g. 5" required></label><p class="muted">WhatsApp opens with your order. Press Send there to submit it. This does not charge you or confirm the order automatically.</p><button id="sendOrder">Continue to WhatsApp</button><p id="checkoutError" role="alert"></p></section></div></body></html>
