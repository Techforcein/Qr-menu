<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PageForge</title><link rel="stylesheet" href="style.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script defer src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script defer src="script.js"></script></head><body>
<header><a class="brand" href="./"><span>◆</span> PageForge</a><div id="account"><button id="logout" class="ghost" hidden>Log out</button></div></header>
<main id="builder"><div class="intro"><p class="eyebrow">WEBSITE GENERATOR</p><h1>Make a page. Share it anywhere.</h1><p>Upload your image, choose colors, publish and get a URL and QR code.</p></div>
<section id="auth" class="panel"><h2>Sign in to publish</h2><div class="fields"><label>Email<input id="email" type="email" autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters"></label></div><div class="actions"><button id="signin">Sign in</button><button id="signup" class="ghost">Create account</button></div><p class="muted">Email confirmation may be required.</p></section>
<div id="editor" class="layout" hidden><section class="panel"><h2>Customize your page</h2><div class="fields"><label>Page title<input id="title" maxlength="100" value="Welcome to my page"></label><label>Subtitle<input id="subtitle" maxlength="160" value="Everything you need, in one place"></label><label>Description<textarea id="description" maxlength="3000" rows="5">A beautiful page made with PageForge.</textarea></label><label>Button text<input id="buttonText" maxlength="50" value="Contact us"></label><label>Button URL<input id="buttonUrl" type="url" placeholder="https://example.com"></label><label>Cover image (JPG, PNG, WEBP; max 5 MB)<input id="image" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="colors"><label>Background<input id="background" type="color" value="#0b1020"></label><label>Accent<input id="accent" type="color" value="#8b5cf6"></label><label>Text<input id="textColor" type="color" value="#ffffff"></label></div></div><div class="actions"><button id="publish">Publish page</button><button id="reset" class="ghost">New page</button></div><p id="status" role="status"></p></section><section><div class="panel previewWrap"><h2>Live preview</h2><div id="preview"></div></div><div id="result" class="panel" hidden><h2>Your page is live!</h2><input id="shareUrl" readonly><div class="actions"><button id="copy">Copy URL</button><a id="openPage" target="_blank" rel="noopener" class="btn ghost">Open page</a></div><canvas id="qr"></canvas><a id="downloadQR" class="btn ghost" download="page-qr.png">Download QR</a></div><div class="panel"><h2>My pages</h2><div id="myPages" class="pages"></div></div></section></div></main>
<main id="publicPage" hidden><div id="publishedContent"></div><p class="footer"><a href="./">Made with PageForge</a></p></main>
</body></html>
